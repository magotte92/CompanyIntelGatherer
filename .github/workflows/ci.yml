name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CompanyIntelGatherer.sln

      - name: Build
        run: dotnet build CompanyIntelGatherer.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test CompanyIntelGatherer.sln --no-build --configuration Release --verbosity normal

      - name: Dependency vulnerability audit
        run: |
          set -euo pipefail
          report="$(dotnet list CompanyIntelGatherer.sln package --vulnerable --include-transitive)"
          printf '%s\n' "$report"
          if printf '%s\n' "$report" | grep -q "has the following vulnerable packages"; then
            echo "Vulnerable NuGet packages remain."
            exit 1
          fi
